
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A minha conta — Loja MZ</title>

  <link rel="icon" href="assets/img/favicon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/auth.css" rel="stylesheet">
</head>

<body>
  <!-- Topbar -->
  <div class="topbar py-2">
    <div class="container d-flex justify-content-between align-items-center small">
      <a href="contacto.html" class="text-white text-decoration-none">
        <i class=""></i>

      </a>

      <div class="dropdown">
        <button class="btn btn-sm btn-language dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-translate me-1"></i>
          <span id="current-language">PT</span>
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
          <li><button class="dropdown-item" data-language="pt">Português</button></li>
          <li><button class="dropdown-item" data-language="en">English</button></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg main-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-bag-heart-fill brand-icon"></i>
        <span class="brand-name">Loja MZ</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html" data-i18n="home">Início</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="produtos.html" data-i18n="products">Produtos</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="conta.html" data-i18n="my_account">A minha conta</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contacto.html" data-i18n="contact">Contacto</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2 ms-lg-3">
          <button class="btn btn-light btn-icon" id="logout-button" title="Terminar sessão">
            <i class="bi bi-box-arrow-right"></i>
          </button>

          <a href="carrinho.html" class="btn btn-light btn-icon position-relative">
            <i class="bi bi-cart3"></i>

            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">
              0
            </span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <section class="section">
    <div class="container">
      <div id="account-loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">A carregar...</span>
        </div>
      </div>

      <div id="account-content" class="d-none">
        <div class="account-card mb-4 d-none" id="open-panel-link">
          <h5>Painel</h5>

          <p class="text-muted mb-3">
            Tens acesso à área de gestão da loja.
          </p>

          <a href="admin/index.html" class="btn btn-primary w-100">
            <i class="bi bi-speedometer2 me-2"></i>
            Abrir painel
          </a>
        </div>

        <div class="row g-4">
          <div class="col-lg-5">
            <div class="account-card mb-4">
              <h5>Dados pessoais</h5>

              <div class="mb-3">
                <label class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="account-name">
              </div>

              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" id="account-email" disabled>
              </div>

              <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="account-phone">
              </div>

              <div class="mb-3">
                <label class="form-label">Telefone alternativo</label>
                <input type="tel" class="form-control" id="account-phone-alt">
              </div>

              <button class="btn btn-primary w-100" id="update-profile-button">
                <i class="bi bi-check2 me-2"></i>
                Atualizar dados
              </button>
            </div>

            <div class="account-card">
              <h5>Morada principal</h5>

              <div class="mb-3">
                <label class="form-label">Província</label>
                <select class="form-select" id="address-province">
                  <option value="">Selecione</option>
                  <option value="Maputo Cidade">Maputo Cidade</option>
                  <option value="Maputo Província">Maputo Província</option>
                  <option value="Gaza">Gaza</option>
                  <option value="Inhambane">Inhambane</option>
                  <option value="Sofala">Sofala</option>
                  <option value="Manica">Manica</option>
                  <option value="Tete">Tete</option>
                  <option value="Zambézia">Zambézia</option>
                  <option value="Nampula">Nampula</option>
                  <option value="Cabo Delgado">Cabo Delgado</option>
                  <option value="Niassa">Niassa</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Cidade / Distrito</label>
                <input type="text" class="form-control" id="address-city">
              </div>

              <div class="mb-3">
                <label class="form-label">Bairro</label>
                <input type="text" class="form-control" id="address-neighborhood">
              </div>

              <div class="mb-3">
                <label class="form-label">Rua / Avenida</label>
                <input type="text" class="form-control" id="address-street">
              </div>

              <div class="mb-3">
                <label class="form-label">Ponto de referência</label>
                <input type="text" class="form-control" id="address-reference">
              </div>

              <button class="btn btn-outline-primary w-100" id="save-address-button">
                <i class="bi bi-geo-alt me-2"></i>
                Guardar morada
              </button>
            </div>
          </div>

          <div class="col-lg-7">
            <div class="account-card">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="mb-0">Os meus pedidos</h5>
              </div>

              <div id="account-orders"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container text-center">
      <p class="mb-0">© <span id="year"></span> Loja online. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/account.js"></script>
</body>
</html>
