  <section class="page-header">
    <div class="container">
      <h1 data-i18n="contact">Contacto</h1>
      <p class="mb-0">Fale connosco para dúvidas, pedidos ou suporte.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="feature-card">
            <h4 class="mb-4">Contactos diretos</h4>

            <div class="info-item">
              <i class="bi bi-envelope"></i>
              <span>leonildokeysse49@gmail.com</span>
            </div>

            <div class="info-item">
              <i class="bi bi-telephone"></i>
              <span>+258 85 321 7149</span>
            </div>

            <div class="info-item">
              <i class="bi bi-whatsapp"></i>
              <span>+258 85 321 7149</span>
            </div>

            <a href="https://wa.me/258853217149" target="_blank" class="btn btn-success w-100 mt-3">
              <i class="bi bi-whatsapp me-2"></i>
              Falar no WhatsApp
            </a>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="feature-card">
            <h4 class="mb-4">Enviar mensagem</h4>

            <form id="contact-form">
              <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="contact-name" required>
              </div>

              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" id="contact-email" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Mensagem</label>
                <textarea class="form-control" id="contact-message" rows="5" required></textarea>
              </div>

              <button class="btn btn-primary w-100" type="submit">
                <i class="bi bi-send me-2"></i>
                Enviar mensagem
              </button>
            </form>
          </div>
        </div>
      </div>
