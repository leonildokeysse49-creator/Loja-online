<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banners — Painel Administrativo</title>

  <link rel="icon" href="../assets/img/favicon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>

<body>
  <div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-bag-heart-fill"></i>
        <span>Loja MZ</span>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>

        <a href="produtos.html" class="sidebar-link">
          <i class="bi bi-box-seam"></i>
          <span>Produtos</span>
        </a>

        <a href="categorias.html" class="sidebar-link">
          <i class="bi bi-tags"></i>
          <span>Categorias</span>
        </a>

        <a href="marcas.html" class="sidebar-link">
          <i class="bi bi-award"></i>
          <span>Marcas</span>
        </a>

        <a href="pedidos.html" class="sidebar-link">
          <i class="bi bi-receipt"></i>
          <span>Pedidos</span>
        </a>

        <a href="clientes.html" class="sidebar-link">
          <i class="bi bi-people"></i>
          <span>Clientes</span>
        </a>

        <a href="cupoes.html" class="sidebar-link">
          <i class="bi bi-ticket-perforated"></i>
          <span>Cupões</span>
        </a>

        <a href="banners.html" class="sidebar-link active">
          <i class="bi bi-image"></i>
          <span>Banners</span>
        </a>

        <a href="avaliacoes.html" class="sidebar-link">
          <i class="bi bi-star"></i>
          <span>Avaliações</span>
        </a>

        <a href="relatorios.html" class="sidebar-link">
          <i class="bi bi-graph-up"></i>
          <span>Relatórios</span>
        </a>

        <a href="configuracoes.html" class="sidebar-link">
          <i class="bi bi-gear"></i>
          <span>Configurações</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-outline-light w-100" id="admin-logout-button">
          <i class="bi bi-box-arrow-right me-2"></i>
          Terminar sessão
        </button>
      </div>
    </aside>

    <!-- Conteúdo -->
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="btn btn-light d-lg-none" id="sidebar-toggle">
          <i class="bi bi-list"></i>
        </button>

        <h1 class="admin-title">Banners</h1>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#banner-modal" onclick="openCreateBannerModal()">
          <i class="bi bi-plus-lg me-1"></i>
          Novo banner
        </button>
      </header>

      <div class="admin-content">
        <div class="admin-card">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Banner</th>
                  <th>Título</th>
                  <th>Link</th>
                  <th>Ordem</th>
                  <th>Estado</th>
                  <th class="text-end">Ações</th>
                </tr>
              </thead>

              <tbody id="banners-table">
                <tr>
                  <td colspan="6" class="text-center text-muted py-4">
                    A carregar banners...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="banner-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="banner-modal-title">Novo banner</h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Título em português</label>
              <input type="text" class="form-control" id="banner-title-pt">
            </div>

            <div class="col-md-6">
              <label class="form-label">Título em inglês</label>
              <input type="text" class="form-control" id="banner-title-en">
            </div>

            <div class="col-md-6">
              <label class="form-label">Subtítulo em português</label>
              <input type="text" class="form-control" id="banner-subtitle-pt">
            </div>

            <div class="col-md-6">
              <label class="form-label">Subtítulo em inglês</label>
              <input type="text" class="form-control" id="banner-subtitle-en">
            </div>

            <div class="col-md-8">
              <label class="form-label">Imagem (URL) *</label>
              <input type="url" class="form-control" id="banner-image" placeholder="https://..." required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Link</label>
              <input type="text" class="form-control" id="banner-link" placeholder="produtos.html">
            </div>

            <div class="col-md-6">
              <label class="form-label">Ordem</label>
              <input type="number" class="form-control" id="banner-sort-order" value="0" min="0">
            </div>

            <div class="col-md-6 d-flex align-items-end">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="banner-active" checked>
                <label class="form-check-label" for="banner-active">
                  Banner ativo
                </label>
              </div>
            </div>

            <div class="col-12">
              <div class="banner-preview mt-3">
                <img src="../assets/img/placeholders/hero.svg" alt="Pré-visualização" id="banner-preview-image">
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>

          <button type="button" class="btn btn-primary" id="save-banner-button">
            <i class="bi bi-check2 me-1"></i>
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/admin/admin-auth.js"></script>
  <script src="../assets/js/admin/banners-admin.js"></script>
</body>
</html>
