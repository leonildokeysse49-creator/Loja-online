
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias — Painel Administrativo</title>

  <link rel="icon" href="../assets/img/favicon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>

<body>
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-bag-heart-fill"></i>
        <span>Loja MZ</span>
      </div>

      <nav class="sidebar-nav" aria-label="Administração">
        <a href="index.html" class="sidebar-link">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>

        <a href="produtos.html" class="sidebar-link">
          <i class="bi bi-box-seam"></i>
          <span>Produtos</span>
        </a>

        <a href="categorias.html" class="sidebar-link active">
          <i class="bi bi-tags"></i>
          <span>Categorias</span>
        </a>

        <a href="pedidos.html" class="sidebar-link">
          <i class="bi bi-receipt"></i>
          <span>Pedidos</span>
        </a>

        <a href="utilizadores.html" class="sidebar-link admin-only">
          <i class="bi bi-person-gear"></i>
          <span>Utilizadores</span>
        </a>

        <a href="clientes.html" class="sidebar-link admin-only">
          <i class="bi bi-people"></i>
          <span>Clientes</span>
        </a>

        <a href="cupoes.html" class="sidebar-link admin-only">
          <i class="bi bi-ticket-perforated"></i>
          <span>Cupões</span>
        </a>

        <a href="banners.html" class="sidebar-link admin-only">
          <i class="bi bi-image"></i>
          <span>Banners</span>
        </a>

        <a href="avaliacoes.html" class="sidebar-link admin-only">
          <i class="bi bi-star"></i>
          <span>Avaliações</span>
        </a>

        <a href="relatorios.html" class="sidebar-link admin-only">
          <i class="bi bi-graph-up"></i>
          <span>Relatórios</span>
        </a>

        <a href="configuracoes.html" class="sidebar-link admin-only">
          <i class="bi bi-gear"></i>
          <span>Configurações</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-outline-light w-100" id="admin-logout-button">
          <i class="bi bi-box-arrow-right me-2"></i>
          Terminar sessão
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <button class="btn btn-light d-lg-none" id="sidebar-toggle">
          <i class="bi bi-list"></i>
        </button>

        <h1 class="admin-title">Categorias</h1>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#category-modal" onclick="openCreateCategoryModal()">
          <i class="bi bi-plus-lg me-1"></i>
          Nova categoria
        </button>
      </header>

      <div class="admin-content">
        <div class="admin-card">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Categoria</th>
                  <th>Slug</th>
                  <th>Categoria pai</th>
                  <th>Ordem</th>
                  <th>Estado</th>
                  <th class="text-end">Ações</th>
                </tr>
              </thead>

              <tbody id="categories-table">
                <tr>
                  <td colspan="6" class="text-center text-muted py-4">
                    A carregar categorias...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="category-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="category-modal-title">Nova categoria</h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="category-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nome em português *</label>
                <input type="text" class="form-control" id="category-name-pt" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Nome em inglês</label>
                <input type="text" class="form-control" id="category-name-en">
              </div>

              <div class="col-md-6">
                <label class="form-label">Slug *</label>
                <input type="text" class="form-control" id="category-slug" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Categoria pai</label>
                <select class="form-select" id="category-parent">
                  <option value="">Nenhuma</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Ordem</label>
                <input type="number" class="form-control" id="category-sort-order" value="0" min="0">
              </div>

              <div class="col-md-6">
                <label class="form-label">Imagem (URL)</label>
                <input type="url" class="form-control" id="category-image" placeholder="https://...">
              </div>

              <div class="col-12">
                <label class="form-label">Descrição em português</label>
                <textarea class="form-control" id="category-description-pt" rows="2"></textarea>
              </div>

              <div class="col-12">
                <label class="form-label">Descrição em inglês</label>
                <textarea class="form-control" id="category-description-en" rows="2"></textarea>
              </div>

              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="category-active" checked>
                  <label class="form-check-label" for="category-active">
                    Categoria ativa
                  </label>
                </div>
              </div>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>

          <button type="button" class="btn btn-primary" id="save-category-button">
            <i class="bi bi-check2 me-1"></i>
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/admin/admin-auth.js"></script>
  <script src="../assets/js/admin/categories-admin.js"></script>
</body>
</html>
