<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupões — Painel Administrativo</title>

  <link rel="icon" href="../assets/img/favicon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>

<body>
  <div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-bag-heart-fill"></i>
        <span>Loja MZ</span>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>

        <a href="produtos.html" class="sidebar-link">
          <i class="bi bi-box-seam"></i>
          <span>Produtos</span>
        </a>

        <a href="categorias.html" class="sidebar-link">
          <i class="bi bi-tags"></i>
          <span>Categorias</span>
        </a>

        <a href="marcas.html" class="sidebar-link">
          <i class="bi bi-award"></i>
          <span>Marcas</span>
        </a>

        <a href="pedidos.html" class="sidebar-link">
          <i class="bi bi-receipt"></i>
          <span>Pedidos</span>
        </a>

        <a href="clientes.html" class="sidebar-link">
          <i class="bi bi-people"></i>
          <span>Clientes</span>
        </a>

        <a href="cupoes.html" class="sidebar-link active">
          <i class="bi bi-ticket-perforated"></i>
          <span>Cupões</span>
        </a>

        <a href="banners.html" class="sidebar-link">
          <i class="bi bi-image"></i>
          <span>Banners</span>
        </a>

        <a href="avaliacoes.html" class="sidebar-link">
          <i class="bi bi-star"></i>
          <span>Avaliações</span>
        </a>

        <a href="relatorios.html" class="sidebar-link">
          <i class="bi bi-graph-up"></i>
          <span>Relatórios</span>
        </a>

        <a href="configuracoes.html" class="sidebar-link">
          <i class="bi bi-gear"></i>
          <span>Configurações</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-outline-light w-100" id="admin-logout-button">
          <i class="bi bi-box-arrow-right me-2"></i>
          Terminar sessão
        </button>
      </div>
    </aside>

    <!-- Conteúdo -->
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="btn btn-light d-lg-none" id="sidebar-toggle">
          <i class="bi bi-list"></i>
        </button>

        <h1 class="admin-title">Cupões</h1>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#coupon-modal" onclick="openCreateCouponModal()">
          <i class="bi bi-plus-lg me-1"></i>
          Novo cupão
        </button>
      </header>

      <div class="admin-content">
        <div class="admin-card">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Desconto</th>
                  <th>Valor mínimo</th>
                  <th>Utilizações</th>
                  <th>Validade</th>
                  <th>Estado</th>
                  <th class="text-end">Ações</th>
                </tr>
              </thead>

              <tbody id="coupons-table">
                <tr>
                  <td colspan="7" class="text-center text-muted py-4">
                    A carregar cupões...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="coupon-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="coupon-modal-title">Novo cupão</h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Código *</label>
              <input type="text" class="form-control text-uppercase" id="coupon-code" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Tipo de desconto *</label>
              <select class="form-select" id="coupon-discount-type" required>
                <option value="percentage">Percentagem (%)</option>
                <option value="fixed">Valor fixo (MT)</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Valor do desconto *</label>
              <input type="number" step="0.01" min="0" class="form-control" id="coupon-discount-value" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Valor mínimo do pedido (MT)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="coupon-min-order" value="0">
            </div>

            <div class="col-md-6">
              <label class="form-label">Limite de utilizações</label>
              <input type="number" min="0" class="form-control" id="coupon-max-uses" placeholder="Deixe vazio para ilimitado">
            </div>

            <div class="col-md-6">
              <label class="form-label">Data de início</label>
              <input type="datetime-local" class="form-control" id="coupon-starts-at">
            </div>

            <div class="col-md-6">
              <label class="form-label">Data de expiração</label>
              <input type="datetime-local" class="form-control" id="coupon-expires-at">
            </div>

            <div class="col-md-6 d-flex align-items-end">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="coupon-active" checked>
                <label class="form-check-label" for="coupon-active">
                  Cupão ativo
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>

          <button type="button" class="btn btn-primary" id="save-coupon-button">
            <i class="bi bi-check2 me-1"></i>
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/admin/admin-auth.js"></script>
  <script src="../assets/js/admin/coupons-admin.js"></script>
</body>
</html>
