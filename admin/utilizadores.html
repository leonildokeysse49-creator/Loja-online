
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Utilizadores — Painel Administrativo</title>

  <link rel="icon" href="../assets/img/favicon.png">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>

<body>
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-bag-heart-fill"></i>
        <span>Loja MZ</span>
      </div>

      <nav class="sidebar-nav" aria-label="Administração">
        <a href="index.html" class="sidebar-link">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>

        <a href="produtos.html" class="sidebar-link">
          <i class="bi bi-box-seam"></i>
          <span>Produtos</span>
        </a>

        <a href="categorias.html" class="sidebar-link">
          <i class="bi bi-tags"></i>
          <span>Categorias</span>
        </a>

        <a href="pedidos.html" class="sidebar-link">
          <i class="bi bi-receipt"></i>
          <span>Pedidos</span>
        </a>

        <a href="utilizadores.html" class="sidebar-link active admin-only">
          <i class="bi bi-person-gear"></i>
          <span>Utilizadores</span>
        </a>

        <a href="clientes.html" class="sidebar-link admin-only">
          <i class="bi bi-people"></i>
          <span>Clientes</span>
        </a>

        <a href="cupoes.html" class="sidebar-link admin-only">
          <i class="bi bi-ticket-perforated"></i>
          <span>Cupões</span>
        </a>

        <a href="banners.html" class="sidebar-link admin-only">
          <i class="bi bi-image"></i>
          <span>Banners</span>
        </a>

        <a href="avaliacoes.html" class="sidebar-link admin-only">
          <i class="bi bi-star"></i>
          <span>Avaliações</span>
        </a>

        <a href="relatorios.html" class="sidebar-link admin-only">
          <i class="bi bi-graph-up"></i>
          <span>Relatórios</span>
        </a>

        <a href="configuracoes.html" class="sidebar-link admin-only">
          <i class="bi bi-gear"></i>
          <span>Configurações</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button
          type="button"
          class="btn btn-outline-light w-100"
          id="admin-logout-button"
        >
          <i class="bi bi-box-arrow-right me-2"></i>
          Terminar sessão
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <button
          type="button"
          class="btn btn-light d-lg-none"
          id="sidebar-toggle"
        >
          <i class="bi bi-list"></i>
        </button>

        <h1 class="admin-title">Utilizadores</h1>

        <button
          type="button"
          class="btn btn-primary"
          id="new-user-button"
        >
          <i class="bi bi-person-plus me-2"></i>
          Novo utilizador
        </button>
      </header>

      <div class="admin-content">
        <div class="admin-card">
          <div
            class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap"
          >
            <h5 class="mb-0">Lista de utilizadores</h5>

            <input
              type="search"
              class="form-control"
              style="max-width: 300px;"
              id="user-search"
              placeholder="Pesquisar por nome ou e-mail..."
            >
          </div>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Papel</th>
                  <th>Estado</th>
                  <th class="text-end">Ações</th>
                </tr>
              </thead>

              <tbody id="users-table-body">
                <tr>
                  <td colspan="5" class="text-center text-muted py-4">
                    A carregar utilizadores...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div
    class="modal fade"
    id="user-modal"
    tabindex="-1"
    aria-labelledby="user-modal-title"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="user-modal-title">
            Novo utilizador
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Fechar"
          ></button>
        </div>

        <form id="user-form">
          <div class="modal-body">
            <input type="hidden" id="user-id">

            <div class="mb-3">
              <label for="user-name" class="form-label">
                Nome completo
              </label>

              <input
                type="text"
                class="form-control"
                id="user-name"
                required
              >
            </div>

            <div class="mb-3">
              <label for="user-email" class="form-label">
                E-mail
              </label>

              <input
                type="email"
                class="form-control"
                id="user-email"
                required
              >
            </div>

            <div class="mb-3">
              <label for="user-password" class="form-label">
                Palavra-passe
              </label>

              <input
                type="password"
                class="form-control"
                id="user-password"
                minlength="6"
              >

              <div class="form-text">
                Obrigatória apenas ao criar um utilizador novo.
              </div>
            </div>

            <div class="mb-3">
              <label for="user-role" class="form-label">
                Papel
              </label>

              <select class="form-select" id="user-role" required>
                <option value="cliente">Cliente</option>
                <option value="vendedor">Vendedor</option>
                <option value="admin">Administrador</option>
              </select>
            </div>

            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                id="user-active"
                checked
              >

              <label class="form-check-label" for="user-active">
                Conta ativa
              </label>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>

            <button type="submit" class="btn btn-primary">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/admin/admin-auth.js"></script>
  <script src="../assets/js/admin/utilizadores.js"></script>
</body>
</html>
