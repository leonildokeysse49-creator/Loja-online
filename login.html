<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Loja MZ</title>

  <link rel="icon" href="assets/img/favicon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/auth.css" rel="stylesheet">
</head>

<body>
  <div class="auth-page">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="auth-card">
            <div class="text-center mb-4">
              <a href="index.html" class="auth-brand">
                <i class="bi bi-bag-heart-fill"></i>
                Loja MZ
              </a>

              <h1>Entrar</h1>
              <p class="text-muted">Acesse a sua conta para continuar.</p>
            </div>

            <form id="login-form">
              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" id="login-email" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Palavra-passe</label>
                <input type="password" class="form-control" id="login-password" required>
              </div>

              <button class="btn btn-primary w-100 btn-lg" type="submit" id="login-button">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Entrar
              </button>
            </form>

            <p class="text-center mt-4 mb-0">
              Não tem conta?
              <a href="registar.html">Criar conta</a>
            </p>

            <p class="text-center mt-3 mb-0">
              <a href="index.html">Voltar à loja</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
